[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "annotation_pipeline"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Juan" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "boto3>=1.43.86",
    "groq>=1.7.0",
    "ipykernel",
    "loguru",
    "matplotlib",
    "mkdocs",
    "mlx-lm>=0.31.3",
    "mlx-vlm",
    "opencv-python",
    "pandas>=3.0.6",
    "pip",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.5",
    "pytest",
    "python-dotenv",
    "pyyaml",
    "ruff",
    "sqlalchemy>=2.1.3",
    "tqdm",
    "typer",
    "ultralytics",
    "videometa>=0.0.19",
]
requires-python = ">=3.14"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple"
explicit = true

[tool.uv.sources]
videometa = { index = "testpypi" }


[tool.ruff]
line-length = 99
src = ["annotation_pipeline"]
include = ["pyproject.toml", "annotation_pipeline/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["annotation_pipeline"]
force-sort-within-sections = true

